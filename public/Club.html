<!-- RESPONSIVE LAYER - No modifica contenido ni funcionalidades, solo adaptabilidad -->
<style id="responsive-layer">
  /* Base responsive resets - no toca lógica, solo layout */
  html { -webkit-text-size-adjust: 100%; }
  body, #root { width: 100%; overflow-x: hidden; }
  img, video, svg, canvas { max-width: 100%; height: auto; }
  
  /* Anula anchos fijos gigantes que rompen mobile - conserva proporciones */
  .w-\[600px\], .w-\[420px\], .w-\[380px\], .w-\[280px\],
  .h-\[600px\], .h-\[420px\], .h-\[380px\], .h-\[280px\] {
    width: 100% !important;
    max-width: 100% !important;
  }
  .h-\[600px\], .h-\[420px\], .h-\[380px\], .h-\[280px\], .h-\[64px\] {
    height: auto !important;
    min-height: unset !important;
  }
  .max-h-\[560px\], .max-h-\[380px\], .max-h-\[360px\] {
    max-height: none !important;
  }
  .max-w-\[1160px\], .max-w-\[860px\], .max-w-\[760px\], .max-w-\[520px\], .max-w-\[420px\], .max-w-\[360px\] {
    max-width: 100% !important;
  }
  .w-\[90\%\] { width: 100% !important; }

  /* Grids: de 3 -> 2 -> 1 columnas sin tocar contenido */
  @media (max-width: 1024px) {
    .grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
    .max-w-\[1160px\] { padding-left: 24px !important; padding-right: 24px !important; }
  }
  @media (max-width: 768px) {
    .grid-cols-3, .grid-cols-2 { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
    .md\:grid-cols-2, .md\:grid-cols-3 { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
    .lg\:grid-cols-3, .lg\:grid-cols-2 { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
  }

  /* Tipografía fluida - reduce solo tamaño, no contenido */
  @media (max-width: 768px) {
    .text-\[54px\] { font-size: clamp(32px, 8vw, 42px) !important; line-height: 1.1 !important; }
    .text-\[48px\] { font-size: clamp(28px, 7vw, 38px) !important; line-height: 1.15 !important; }
    .text-\[36px\] { font-size: clamp(24px, 6vw, 30px) !important; }
    .text-\[32px\] { font-size: clamp(22px, 5.5vw, 28px) !important; }
    .text-\[24px\] { font-size: clamp(18px, 4.5vw, 22px) !important; }
  }
  @media (max-width: 640px) {
    .px-6 { padding-left: 16px !important; padding-right: 16px !important; }
    .px-5 { padding-left: 14px !important; padding-right: 14px !important; }
    .p-6 { padding: 16px !important; }
    .p-5 { padding: 14px !important; }
    .gap-8 { gap: 20px !important; }
    .gap-6 { gap: 16px !important; }
    .mt-10 { margin-top: 24px !important; }
    .pb-24 { padding-bottom: 32px !important; }
    .pb-20 { padding-bottom: 24px !important; }
    .text-\[22px\], .text-\[20px\], .text-\[18px\] { font-size: clamp(16px, 4vw, 20px) !important; }
  }

  /* Flex y contenedores que no deben desbordar */
  .flex { flex-wrap: wrap; }
  .overflow-x-hidden { overflow-x: clip; }

  /* Tablas / cards / elementos con posicionamiento absoluto decorativo: que no generen scroll */
  @media (max-width: 768px) {
    .-right-24, .-right-16, .-right-12, .-right-10, .-left-20, .-top-24, .-top-16, .-bottom-24 {
      display: none !important; /* decorativos, no afectan funcionalidad */
    }
  }

  /* Asegura que cualquier contenedor ancho use 100vw seguro */
  @media (max-width: 480px) {
    .mx-auto { margin-left: auto !important; margin-right: auto !important; width: 100% !important; }
    .rounded-\[28px\], .rounded-\[24px\], .rounded-\[22px\] { border-radius: 18px !important; }
  }

  /* 4K y pantallas grandes: centra y limita crecimiento excesivo */
  @media (min-width: 1536px) {
    .max-w-\[1160px\] { max-width: 1280px !important; }
  }

  /* Impresión y landscape mobile */
  @media (max-height: 500px) and (orientation: landscape) {
    .min-h-screen { min-height: auto !important; }
    .py-12 { padding-top: 16px !important; padding-bottom: 16px !important; }
  }
</style>
